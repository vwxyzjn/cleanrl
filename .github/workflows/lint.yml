name: lint

on:
  pull_request:
    paths:
      - 'cleanrl/**'
      - 'cleanrl_utils/**'
      - 'tests/**'
      - 'benchmark/**'
      - 'tuner_example.py'
      - '.github/workflows/lint.yml'
      - 'pyproject.toml'
  push:
    branches:
      - master
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same branch/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        os: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: uv venv

      - name: Install ruff
        run: uv pip install ruff

      - name: Run ruff check (rules from pyproject.toml)
        run: |
          uv run ruff check cleanrl cleanrl_utils tests benchmark tuner_example.py

      - name: Run ruff format --check
        run: |
          uv run ruff format --check cleanrl cleanrl_utils tests benchmark tuner_example.py
