name: lint

on:
  pull_request:
    paths:
      - 'cleanrl/**'
      - 'cleanrl_utils/**'
      - 'tests/**'
      - 'benchmark/**'
      - 'tuner_example.py'
      - '.github/workflows/lint.yml'
      - 'pyproject.toml'
  push:
    branches:
      - master
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same branch/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        os: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: uv venv

      - name: Install ruff
        run: uv pip install ruff

      - name: Collect changed Python files
        id: changed-python
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="${{ github.event.before }}"
          fi

          git diff --name-only --diff-filter=ACMRT "$base_ref"...HEAD -- '*.py' \
            | grep -E '^(cleanrl/|cleanrl_utils/|tests/|benchmark/|tuner_example\.py$)' \
            > changed-python-files.txt || true

          if [[ -s changed-python-files.txt ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No changed Python files to lint."
          fi

      - name: Run ruff check
        if: steps.changed-python.outputs.has_files == 'true'
        run: |
          xargs -a changed-python-files.txt uv run ruff check

      - name: Run ruff format --check
        if: steps.changed-python.outputs.has_files == 'true'
        run: |
          xargs -a changed-python-files.txt uv run ruff format --check
